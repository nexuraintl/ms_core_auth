# azure-pipelines.yml — ms_core_auth (esquema TRANSITORIO: Azure DevOps -> GitHub -> Cloud Build)
#
# Sincroniza qa y master hacia GitHub (nexuraintl/ms_core_auth). Un trigger de Cloud Build
# conectado a ese repo construye y despliega en Cloud Run (proyecto nexura-preproduccion-qa):
#   master -> prem-core-auth      qa -> qam-core-auth (cuando exista)
# nexuraintl es una cuenta de usuario de GitHub: el repo debe existir (privado) y el dueño del
# token ser su dueño o colaborador con escritura. Requiere la variable de pipeline secreta
# GITHUB_TOKEN_NEXURAINTL (scope 'repo').
#
# El esquema definitivo (WIF, sin GitHub) esta listo en azure-pipelines-wif.yml +
# ci/deploy-cloudrun-wif.yml + cloudbuild.yaml: cuando exista la service connection
# gcp-nexura-preproduccion-qa basta con repuntar el pipeline a ese archivo.

trigger:
  branches:
    include:
      - qa
      - master

pool:
  vmImage: ubuntu-latest

variables:
  GIT_USER: $(Build.RequestedFor)
  GIT_EMAIL: $(Build.RequestedForEmail)

  # Organización GitHub destino
  GITHUB_ORG: "nexuraintl"

  # Rama actual
  BRANCH_NAME: $(Build.SourceBranchName)

steps:

  # 1️⃣ Checkout completo
  - checkout: self
    clean: true
    persistCredentials: true
    fetchDepth: 0

  # 2️⃣ Configuración Git
  - script: |
      echo "Configurando Git..."

      git config --global user.name "$(GIT_USER)"
      git config --global user.email "$(GIT_EMAIL)"

      echo "Usuario Git configurado:"
      git config --global user.name
      git config --global user.email
    displayName: "Configurar Git"

  # 3️⃣ Detectar nombre del repo dinámicamente
  - script: |
      echo "Repositorio detectado desde ADO:"
      echo "$(Build.Repository.Name)"

      # Si viene tipo Proyecto/repo -> obtiene solo repo
      REPO_NAME=$(basename "$(Build.Repository.Name)")

      echo "Nombre final repo:"
      echo "$REPO_NAME"

      # Guardar variable para siguientes steps
      echo "##vso[task.setvariable variable=REPO_NAME]$REPO_NAME"
    displayName: "Detectar nombre repo"

  # 4️⃣ Verificar existencia del repo en GitHub — crearlo si no existe
  # nexuraintl es una cuenta de USUARIO de GitHub (no una organizacion): solo el token de
  # esa misma cuenta puede crear repos en ella (POST /user/repos). Con el token de otra
  # persona el repo debe existir ya y la persona ser colaboradora con permiso de escritura.
  - script: |
      echo "Verificando existencia del repo en GitHub..."
      echo "Repo: $(GITHUB_ORG)/$(REPO_NAME)"

      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
        -H "Authorization: token $(GITHUB_TOKEN_NEXURAINTL)" \
        -H "Accept: application/vnd.github.v3+json" \
        "https://api.github.com/repos/$(GITHUB_ORG)/$(REPO_NAME)")
      echo "HTTP status GitHub API: $HTTP_STATUS"

      if [ "$HTTP_STATUS" = "200" ]; then
        echo "Repo ya existe en GitHub: $(GITHUB_ORG)/$(REPO_NAME)"
        exit 0
      fi

      if [ "$HTTP_STATUS" != "404" ]; then
        echo "ERROR: respuesta inesperada de la API de GitHub ($HTTP_STATUS). Verificar GITHUB_TOKEN_NEXURAINTL (scope 'repo', autorizado por SSO si aplica)."
        exit 1
      fi

      TOKEN_LOGIN=$(curl -s -H "Authorization: token $(GITHUB_TOKEN_NEXURAINTL)" https://api.github.com/user | sed -n 's/.*"login": *"\([^"]*\)".*/\1/p' | head -1)
      echo "El token pertenece al usuario de GitHub: $TOKEN_LOGIN"

      if [ "$TOKEN_LOGIN" != "$(GITHUB_ORG)" ]; then
        echo "======================================="
        echo "ERROR: el repo $(GITHUB_ORG)/$(REPO_NAME) NO existe (o el token no tiene acceso)."
        echo "$(GITHUB_ORG) es una cuenta de usuario: solo su dueño puede crear repos en ella."
        echo "Pedir al dueño que cree el repo PRIVADO '$(REPO_NAME)' (vacio, sin README)"
        echo "y agregue a '$TOKEN_LOGIN' como colaborador con permiso de escritura."
        echo "======================================="
        exit 1
      fi

      echo "Repo no existe. Creando en GitHub..."
      CREATE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
        -H "Authorization: token $(GITHUB_TOKEN_NEXURAINTL)" \
        -H "Accept: application/vnd.github.v3+json" \
        https://api.github.com/user/repos \
        -d "{\"name\": \"$(REPO_NAME)\", \"private\": true, \"auto_init\": false, \"description\": \"Sincronizado desde Azure DevOps\"}")
      echo "HTTP status creacion: $CREATE_STATUS"
      [ "$CREATE_STATUS" = "201" ] || { echo "ERROR: no se pudo crear el repo"; exit 1; }
      echo "Repo creado: $(GITHUB_ORG)/$(REPO_NAME)"
    env:
      GITHUB_TOKEN_NEXURAINTL: $(GITHUB_TOKEN_NEXURAINTL)
    displayName: "Verificar o crear repo en GitHub"

  # 5️⃣ Sincronizar rama hacia GitHub
  - script: |
      echo "Sincronizando repo..."
      echo "Repo: $(REPO_NAME)"
      echo "Rama: $(BRANCH_NAME)"

      GITHUB_URL="https://$(GITHUB_TOKEN_NEXURAINTL)@github.com/$(GITHUB_ORG)/$(REPO_NAME).git"

      echo "Actualizando remotos..."

      git remote add github "$GITHUB_URL" || true
      git remote set-url github "$GITHUB_URL"

      echo "Remotos configurados:"
      git remote -v

      echo "Actualizando referencias..."
      git fetch --all

      echo "Push hacia GitHub..."

      git push github HEAD:refs/heads/$(BRANCH_NAME) --force -v

      PUSH_STATUS=$?

      if [ $PUSH_STATUS -ne 0 ]; then
        echo "======================================="
        echo "ERROR: Falló sincronización con GitHub"
        echo "Repo: $(REPO_NAME)"
        echo "Rama: $(BRANCH_NAME)"
        echo "======================================="
        exit 1
      fi

      echo "======================================="
      echo "Sincronización completada"
      echo "Repo: $(REPO_NAME)"
      echo "Rama: $(BRANCH_NAME)"
      echo "======================================="
    env:
      GITHUB_TOKEN_NEXURAINTL: $(GITHUB_TOKEN_NEXURAINTL)
    displayName: "Sincronizar con GitHub"